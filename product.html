<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product — Tarang</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site">
  <nav class="site-nav">
    <a href="index.html" class="logo">Tarang</a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="shop.html" class="active">Shop</a>
      <a href="index.html#story">Our story</a>
    </div>
    <div class="nav-icons">
      <a href="wishlist.html" class="icon-link" aria-label="Wishlist">
        <svg viewBox="0 0 24 24"><path d="M12 21s-7-4.35-9.5-8.5C.5 8.5 2.5 5 6 5c2 0 3.5 1 4 2.5C10.5 6 12 5 14 5c3.5 0 5.5 3.5 3.5 7.5C19 16.65 12 21 12 21z"/></svg>
        <span class="badge" data-wishlist-count>0</span>
      </a>
      <a href="cart.html" class="icon-link" aria-label="Cart">
        <svg viewBox="0 0 24 24"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
        <span class="badge" data-cart-count>0</span>
      </a>
    </div>
  </nav>
</header>

<section class="tight">
  <div class="wrap" id="productRoot">
    <!-- filled by JS -->
  </div>
</section>

<section id="alsoLikeSection" class="tight" style="display:none;">
  <div class="wrap">
    <div class="section-head"><div><h2>You might also like</h2></div></div>
    <div class="grid" id="relatedGrid"></div>
  </div>
</section>

<footer class="site">
  <div class="wrap">
    <div>
      <div class="logo">Tarang</div>
      <p style="margin-top:10px; max-width:32ch;">Handmade bracelets, made in small batches in India.</p>
    </div>
    <div>
      <div style="font-weight:600; color:var(--bone); margin-bottom:10px;">Shop</div>
      <div style="display:flex; flex-direction:column; gap:6px;">
        <a href="shop.html">All bracelets</a>
        <a href="cart.html">Cart</a>
        <a href="wishlist.html">Wishlist</a>
      </div>
    </div>
    <div>
      <div style="font-weight:600; color:var(--bone); margin-bottom:10px;">Contact</div>
      <div style="display:flex; flex-direction:column; gap:6px;">
        <a href="mailto:hello@tarang.example">hello@tarang.example</a>
        <span>Agra, Uttar Pradesh, India</span>
      </div>
    </div>
  </div>
  <div class="wrap foot-note">© <span id="yr"></span> Tarang. All rights reserved.</div>
</footer>

<script src="js/products.js"></script>
<script src="js/store.js"></script>
<script>
  document.getElementById("yr").textContent = new Date().getFullYear();

  const params = new URLSearchParams(location.search);
  const product = PRODUCTS.find(p => p.id === params.get("id"));
  let qty = 1;

  function render() {
    const root = document.getElementById("productRoot");
    if (!product) {
      root.innerHTML = `<div class="empty-state"><h2>We couldn't find that piece</h2><p>It may have sold out or the link is off.</p><a href="shop.html" class="btn btn-ink">Back to shop</a></div>`;
      return;
    }
    document.title = product.name + " — Tarang";
    const wished = isWishlisted(product.id);
    root.innerHTML = `
      <div class="product-detail">
        <div class="pd-art">${braceletArt(product, 380)}</div>
        <div>
          <div class="pd-cat">${product.category}</div>
          <h1 class="pd-name">${product.name}</h1>
          <div class="pd-price">${formatINR(product.price)}</div>
          <p class="pd-blurb">${product.details}</p>
          <div class="pd-material"><strong>Material:</strong> ${product.material}</div>
          <div class="pd-actions">
            <div class="qty-control">
              <button id="qtyMinus" aria-label="Decrease quantity">−</button>
              <span id="qtyVal">${qty}</span>
              <button id="qtyPlus" aria-label="Increase quantity">+</button>
            </div>
            <button class="btn btn-ink" id="addBtn">Add to cart</button>
            <button class="wish-toggle ${wished ? "active" : ""}" id="wishBtn" style="position:static;" aria-label="Toggle wishlist">
              <svg viewBox="0 0 24 24"><path d="M12 21s-7-4.35-9.5-8.5C.5 8.5 2.5 5 6 5c2 0 3.5 1 4 2.5C10.5 6 12 5 14 5c3.5 0 5.5 3.5 3.5 7.5C19 16.65 12 21 12 21z"/></svg>
            </button>
          </div>
          <p id="addedNote" style="display:none; margin-top:14px; color:var(--moss); font-size:0.9rem;">Added to your cart. <a href="cart.html" style="text-decoration:underline;">View cart →</a></p>
        </div>
      </div>`;

    document.getElementById("qtyMinus").onclick = () => { qty = Math.max(1, qty - 1); document.getElementById("qtyVal").textContent = qty; };
    document.getElementById("qtyPlus").onclick = () => { qty = Math.min(10, qty + 1); document.getElementById("qtyVal").textContent = qty; };
    document.getElementById("addBtn").onclick = () => {
      addToCart(product.id, qty);
      document.getElementById("addedNote").style.display = "block";
    };
    document.getElementById("wishBtn").onclick = (e) => {
      const active = toggleWishlist(product.id);
      e.currentTarget.classList.toggle("active", active);
    };

    const related = PRODUCTS.filter(p => p.category === product.category && p.id !== product.id).slice(0, 4);
    if (related.length) {
      document.getElementById("alsoLikeSection").style.display = "block";
      document.getElementById("relatedGrid").innerHTML = related.map(cardHTML).join("");
    }
  }

  render();
</script>
</body>
</html>
